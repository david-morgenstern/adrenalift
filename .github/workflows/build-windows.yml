name: Build Windows exe

# Builds the Adrenalift Windows executables with PyInstaller.
#
# - On every push to main / PR / manual run: uploads the .exe files as a
#   downloadable workflow *artifact* (grab them from the run's "Artifacts"
#   section; requires being signed in to GitHub, kept for 90 days).
# - On push to main: reads the version from version.json, and if the
#   corresponding tag (e.g. v0.1.6) does not yet exist, creates it and
#   publishes a GitHub *Release* with the .exe files attached automatically.
# - On pushing a version tag like `v0.1.6` manually: same release behaviour.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to create a Release and push tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone the UPP dependency (VBIOS decoding)
        run: git clone --depth 1 https://github.com/sibradzic/upp.git deps/upp

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the web console exe
        run: python -m PyInstaller --noconfirm build_web.spec

      - name: Build the desktop GUI exe
        run: python -m PyInstaller --noconfirm build.spec

      - name: List build output
        run: dir dist

      - name: Upload exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adrenalift-windows-exe
          path: dist/*.exe
          if-no-files-found: error

      - name: Auto-tag and publish Release (main push builds only)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import json; print(json.load(open('version.json'))['version'])" \
            || { echo "ERROR: Could not read version from version.json"; exit 1; })
          TAG="v${VERSION}"
          if git ls-remote --tags origin "${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} already exists – skipping release."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
            gh release create "${TAG}" dist/*.exe \
              --title "Adrenalift ${TAG}" \
              --generate-notes
          fi

      - name: Publish Release (manual tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.exe \
            --title "Adrenalift ${GITHUB_REF_NAME}" \
            --generate-notes
