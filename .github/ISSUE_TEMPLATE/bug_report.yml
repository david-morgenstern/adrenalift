name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below so we can reproduce and fix the issue.

        > **Tip:** The single most helpful thing you can attach is an exported diagnostics zip — see the **Diagnostics / logs** field below.

  - type: input
    id: version
    attributes:
      label: Adrenalift Version
      description: Which version are you running? (shown in the app's title bar / Settings)
      placeholder: v1.0.0
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU Model
      description: "Your AMD Radeon RX 9000 series (RDNA 4) GPU (e.g., RX 9070 XT)"
      placeholder: RX 9070 XT
    validations:
      required: true

  - type: input
    id: driver
    attributes:
      label: AMD Driver Version
      description: "Adrenalin driver version (e.g., 25.3.1)"
      placeholder: "25.3.1"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows Version
      description: "Windows version and build (run `winver`)"
      placeholder: "Windows 11 24H2 (Build 26100)"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: App Mode
      description: Which mode was active when the issue happened?
      options:
        - Safe mode (default, no helper driver)
        - Advanced mode (InpOut helper driver loaded)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly. What did you expect vs. what actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this? Be as specific as possible.
      placeholder: |
        1. Open Adrenalift
        2. Go to the Tweaking tab
        3. Set GPU clock offset to ...
        4. Click Apply
        5. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Tweaking (clocks / voltage / memory / power)
        - Cooling (fan curve)
        - Monitoring (charts / metrics / CSV export)
        - Stress test
        - Profiles
        - Calibration / V·F curve
        - App / UI / settings
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Crash / BSOD
        - Display corruption
        - Apply failed / setting not taking effect
        - Monitoring / telemetry issue
        - Anti-cheat or security-software conflict
        - UI issue
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Diagnostics / logs
      description: |
        Please attach an exported diagnostics zip. In Adrenalift, open
        **Settings → Export logs → Export…** to save a zip containing the
        application log and diagnostics, then drag-and-drop it into this box.

        > **Tip:** You can drag-and-drop files directly into this text box to upload them.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, your profile settings, or anything else that might help.
    validations:
      required: false
